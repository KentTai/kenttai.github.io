<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // 使用 JavaScript 立即導向
    window.location.replace("https://www.smolens.co/index.html");
  </script>
</head>
<body>
  <!-- 隱藏的備用連結，避免使用者看到 -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://www.smolens.co/index.html">
    <a href="https://www.smolens.co/index.html" style="display:none;">Backup link</a>
  </noscript>
</body>
</html>
